<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>静的テストページ</title>
  </head>
  <body>
    <header>
      <nav id="ember482" class="css-1a2b3c">自動生成っぽいid/class（無視されるべき）</nav>
    </header>
    <main>
      <h1 id="headline">初期の見出しです</h1>
      <p data-testid="price">価格: ¥1,980</p>
      <a id="product-link" href="/product">商品ページへ</a>
      <img id="hero-image" src="/images/hero.jpg" alt="ヒーロー画像" />
      <section aria-label="お知らせ">
        <p class="notice">通常のお知らせテキスト</p>
      </section>
      <div id="product-card">
        <p>カード内の説明テキスト</p>
        <img src="/images/card-1.jpg" alt="カード画像1" />
        <img src="/images/card-2.jpg" alt="カード画像2" />
      </div>
      <ul id="item-list">
        <li class="item">項目A</li>
        <li class="item">項目B</li>
        <li class="item">項目C</li>
      </ul>
      <ul id="photo-list">
        <li class="photo-item">
          記事1
          <img src="/images/entry-1.jpg" alt="記事1画像" />
        </li>
        <li class="photo-item">記事2（画像なし）</li>
        <li class="photo-item">
          記事3
          <img src="/images/entry-3a.jpg" alt="記事3画像A" />
          <img src="/images/entry-3b.jpg" alt="記事3画像B" />
        </li>
      </ul>
    </main>
  </body>
</html>
