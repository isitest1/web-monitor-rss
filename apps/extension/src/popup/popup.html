<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Web Monitor RSS</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 320px;
        margin: 0;
        padding: 12px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      button {
        width: 100%;
        padding: 8px;
        border: none;
        border-radius: 6px;
        background: #1a1a1a;
        color: #fff;
        cursor: pointer;
        font-size: 13px;
        margin-bottom: 10px;
      }
      .filter-row {
        margin-bottom: 8px;
      }
      .filter-row select {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 12px;
        color: #1a1a1a;
        background: #fff;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        max-height: 312px;
        overflow-y: auto;
      }
      li {
        padding: 6px 0;
        border-bottom: 1px solid #eee;
        font-size: 12px;
      }
      .status {
        color: #666;
      }
      .empty {
        color: #666;
        font-size: 12px;
      }
      a {
        color: #1a1a1a;
      }
      .badge {
        display: inline-block;
        font-size: 10px;
        padding: 1px 6px;
        border-radius: 999px;
        background: #eee;
        color: #444;
        margin-left: 4px;
      }
      .check-now-btn {
        width: auto;
        padding: 2px 8px;
        margin: 4px 0 0;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <h1>Web Monitor RSS</h1>
    <button id="start-selection">Start selecting on this page</button>
    <div class="filter-row">
      <select id="mode-filter">
        <option value="all">Show all</option>
        <option value="server">Server only</option>
        <option value="local">Local only</option>
      </select>
    </div>
    <div id="watchlist">
      <p class="empty">Loading...</p>
    </div>
    <p><a id="open-admin" href="#" target="_blank">Open admin panel</a></p>
    <p><a href="options.html" target="_blank">Open settings</a></p>
    <script src="popup.js"></script>
  </body>
</html>
