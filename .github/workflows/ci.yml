name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @web-monitor/runner exec playwright install --with-deps chromium

      - name: Run CI checks
        # `pnpm ci` (no `run`) is reserved by pnpm itself for a future built-in
        # command and errors with ERR_PNPM_CI_NOT_IMPLEMENTED, so the "ci"
        # script must be invoked explicitly via `pnpm run ci`.
        run: pnpm run ci
